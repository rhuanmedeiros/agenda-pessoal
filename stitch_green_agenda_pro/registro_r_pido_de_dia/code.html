<style>
          .glass-panel {
              background: rgba(18, 26, 22, 0.7);
              backdrop-filter: blur(12px);
              -webkit-backdrop-filter: blur(12px);
              border: 1px solid rgba(255, 255, 255, 0.05);
          }
          
          /* Hide scrollbar for clean modal look if it overflows */
          ::-webkit-scrollbar {
              display: none;
          }
          * {
              scrollbar-width: none;
          }

          .type-card input[type="radio"]:checked + div {
              border-color: #10B981;
              background-color: rgba(16, 185, 129, 0.1);
              box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
          }
          
          .type-card input[type="radio"]:checked + div .material-symbols-outlined {
              color: #10B981;
              font-variation-settings: 'FILL' 1;
          }

              border-color: #10B981;
              box-shadow: 0 1px 0 0 #10B981;
          }

<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Modal Container -->
<main class="w-full max-w-md bg-surface-elevated rounded-xl shadow-2xl border border-white/10 overflow-hidden relative">
<!-- Header -->
<header class="flex justify-between items-center p-6 border-b border-white/5">
<h1 class="font-headline-md text-headline-md text-on-surface">Registro Rápido</h1>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-2 -mr-2 rounded-full hover:bg-surface-variant/20">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Form Content -->
<form class="p-6 flex flex-col gap-stack-gap">
<!-- Day Type Selection -->
<section>
<h2 class="font-label-bold text-label-bold text-on-surface-variant mb-3 uppercase tracking-wider">Tipo de Dia</h2>
<div class="grid grid-cols-3 gap-3">
<label class="type-card cursor-pointer relative">
<input class="sr-only" name="day_type" type="radio" value="por_conta">
<div class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container border border-outline-variant/30 transition-all duration-200 h-28 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-3xl mb-2 text-on-surface-variant transition-colors">work</span>
<span class="font-body-md text-body-md text-center leading-tight">Por Conta</span>
</div>
</label><label class="type-card cursor-pointer relative">
<input checked="" class="sr-only" name="day_type" type="radio" value="com_pai">
<div class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container border border-outline-variant/30 transition-all duration-200 h-28 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-3xl mb-2 text-on-surface-variant transition-colors">groups</span>
<span class="font-body-md text-body-md text-center leading-tight">Com o Pai</span>
</div>
</label>

<label class="type-card cursor-pointer relative">
<input class="sr-only" name="day_type" type="radio" value="folga">
<div class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container border border-outline-variant/30 transition-all duration-200 h-28 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-3xl mb-2 text-on-surface-variant transition-colors">beach_access</span>
<span class="font-body-md text-body-md text-center leading-tight">Folga</span>
</div>
</label>
</div>
</section>
<!-- Details Inputs -->
<section class="flex flex-col gap-4">
<div class="relative">
<label class="sr-only" for="descricao">O que foi feito?</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">edit</span>
</div>
<input class="custom-input block w-full pl-10 pr-3 py-3 bg-surface-container/50 border-0 border-b-2 border-outline-variant/50 text-on-surface font-body-lg text-body-lg focus:ring-0 focus:border-primary-container placeholder-text-muted transition-colors rounded-t-DEFAULT" id="descricao" name="descricao" placeholder="O que foi feito?" type="text">
</div>
<div class="relative">
<label class="sr-only" for="valor">Valor estimado</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">attach_money</span>
</div>
<input class="custom-input block w-full pl-10 pr-3 py-3 bg-surface-container/50 border-0 border-b-2 border-outline-variant/50 text-on-surface font-data-mono text-data-mono focus:ring-0 focus:border-primary-container placeholder-text-muted transition-colors rounded-t-DEFAULT" id="valor" name="valor" placeholder="Valor estimado (R$)" type="number">
</div>
</section>
<!-- Checkbox -->
<section class="flex items-center mt-2">
<input class="w-5 h-5 bg-surface-container border-outline-variant rounded text-primary-container focus:ring-primary-container/50 focus:ring-offset-0 focus:ring-offset-background" id="add_details" type="checkbox">
<label class="ml-3 font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="add_details">
                    Adicionar detalhes depois
                </label>
</section>
<!-- Action Buttons -->
<footer class="mt-4 pt-4 border-t border-white/5 flex gap-4">
<button class="flex-1 py-4 px-6 rounded-lg font-headline-md text-headline-md text-on-surface-variant bg-transparent border border-outline-variant hover:bg-surface-variant/20 transition-colors" type="button">
                    Cancelar
                </button>
<button class="flex-[2] py-4 px-6 rounded-lg font-headline-md text-headline-md text-background bg-primary-container hover:bg-primary-fixed transition-colors shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:shadow-[0_0_25px_rgba(16,185,129,0.5)] flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    Salvar
                </button>
</footer>
</form>
</main>
<script>
        // Simple micro-interaction for form submission
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Salvando...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">done_all</span> Salvo!';
                btn.classList.remove('opacity-80');
                btn.classList.replace('bg-primary-container', 'bg-tertiary-container');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-tertiary-container', 'bg-primary-container');
                    this.reset();
                }, 1500);
            }, 800);
        });
    </script>


</body></html>
